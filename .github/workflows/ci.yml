name: CI

# `publish.yml` shipped this package on every release without running a single test.
# This is the check that has to be green before a release is cut.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Design system
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Tests (Vitest)
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # The consumers import `dist/`, so a package that does not build is a package that
      # breaks every application at install time rather than here.
      - name: Build
        run: npm run build
